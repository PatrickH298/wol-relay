name: Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild of the current release to pick up base image security
    # updates. Mondays 07:23 UTC.
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR builds, but never cancel a publish mid-push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/patrickh298/wol-relay
  # Publish only from main (push, schedule, or manual run on main). PRs,
  # including ones from forks, only build and test and never log in.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  # Job name is the required status check on main; rename both together.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # GHCR push; fork PRs get a read-only token regardless
    outputs:
      version: ${{ steps.version.outputs.version }}
      create_tag: ${{ steps.version.outputs.create_tag }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and tags, for the version checks

      # The version is __version__ in wol_relay.py. On PRs this fails if the
      # image changed without a bump; on main it refuses to overwrite an
      # already-released version with different code.
      - name: Check version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 .github/ci/version.py check-pr "$BASE_SHA"
          else
            python3 .github/ci/version.py check-release
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build the native image into the local Docker engine so it can be
      # started and tested before anything is published.
      - name: Build test image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: wol-relay:ci

      - name: Smoke test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/ci/smoke-test.sh wol-relay:ci "$VERSION"

      # 1.2.3 -> 1.2.3, 1.2, 1, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=wol-relay
            org.opencontainers.image.description=Wake-on-LAN relay: sends broadcast magic packets on request
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image only COPYs a Python script onto the base image (no RUN
      # steps), so the arm64 build needs no emulation.
      - name: Build and publish (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Tag the commit and create a GitHub release the first time a version is
  # published. Weekly rebuilds of an existing version skip this.
  release:
    needs: build
    if: >-
      needs.build.outputs.create_tag == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the tag and release
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
